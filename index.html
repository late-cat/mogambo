<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Diwali 🪔</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Great+Vibes&family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lit-up Diwali City Skyline Backdrop -->
    <div class="city-backdrop"></div>
    <div class="sky-gradient-overlay"></div>

    <!-- Hardware-Accelerated 60FPS Fireworks Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Sudden Skyburst Flash -->
    <div id="flash" class="flash-overlay"></div>

    <!-- Minimalist Meme Landing Screen: Sleek Play Button -->
    <div id="landingScreen" class="landing-screen">
        <div class="play-btn-wrapper">
            <button id="playBtn" class="play-btn" aria-label="Play">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <div class="btn-ripple"></div>
            </button>
            <div id="clickHint" class="click-hint">Click ▶</div>
        </div>
    </div>

    <!-- Celebration Screen: Typography + Dynamic Living Diya -->
    <div id="celebrationScreen" class="celebration-screen hidden">
        <div class="greeting-container">
            <!-- Radiant Golden Backlight Halo -->
            <div class="heading-glow-halo"></div>

            <div class="diwali-title-box">
                <div class="diwali-badge">
                    <span class="badge-gem">✦</span>
                    <span class="badge-line"></span>
                    <span class="badge-label">FESTIVAL OF LIGHTS</span>
                    <span class="badge-line"></span>
                    <span class="badge-gem">✦</span>
                </div>

                <h1 class="diwali-heading">
                    <span class="text-happy">Happy</span>
                    <span class="text-diwali">DIWALI</span>
                </h1>

                <div class="ornament-divider">
                    <span class="divider-line left"></span>
                    <span class="divider-gem">✦ &nbsp; ❖ &nbsp; ✦</span>
                    <span class="divider-line right"></span>
                </div>
            </div>

            <!-- Front-Facing Hyper-Realistic Diya -->
            <div class="diya-stage">
                <div class="diya-light-pool"></div>
                <div class="diya-photo-container">
                    <img src="diya-front.png" alt="Diwali Diya" class="realistic-diya-img">
                </div>
            </div>

            <!-- Fading Tap Hint -->
            <div id="tapGuide" class="tap-guide">Tap screen to celebrate ✨</div>
        </div>

        <!-- Sleek Floating Replay Button -->
        <button id="replayBtn" class="replay-btn" aria-label="Replay" title="Replay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        </button>
    </div>

    <!-- Audio Elements -->
    <audio id="diwaliAudio" preload="auto">
        <source src="diwali-wish.mp3" type="audio/mpeg">
    </audio>
    <audio id="whistleAudio" preload="auto">
        <source src="mixkit-fast-whistle-firework-3103.wav" type="audio/wav">
    </audio>
    <audio id="explosionAudio" preload="auto">
        <source src="mixkit-firework-rockets-exploding-in-the-sky-2993.wav" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
