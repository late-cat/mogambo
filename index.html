<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Poppins:wght@600;800&family=Rozha+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Canvas for Nuclear Plasma & Fireworks -->
    <canvas id="canvas"></canvas>

    <!-- White-hot Blinding Flash Overlay for Nuclear Detonation -->
    <div id="flash" class="flash-overlay"></div>

    <!-- Expanding Plasma Shockwave -->
    <div id="shockwave" class="shockwave"></div>

    <!-- Minimal Meme Landing Screen: ONLY the Play Button -->
    <div id="landingScreen" class="landing-screen">
        <button id="playBtn" class="meme-play-btn" aria-label="Play">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <div class="pulse-ring"></div>
        </button>
    </div>

    <!-- Rocket Projectile with Spark Trail -->
    <div id="rocket" class="rocket">
        <div class="rocket-core">🧨</div>
        <div class="rocket-fire"></div>
    </div>

    <!-- Celebration Screen: ONLY "HAPPY DIWALI" Stylish Greeting -->
    <div id="celebrationScreen" class="celebration-screen hidden">
        <div class="diwali-box">
            <h1 class="diwali-text">
                <span class="happy">HAPPY</span>
                <span class="diwali">DIWALI</span>
            </h1>
            <div class="flame-diyas">
                <span class="diya">🪔</span>
                <span class="sparkle">✨</span>
                <span class="diya">🪔</span>
            </div>
        </div>

        <button id="replayBtn" class="replay-btn" title="Replay">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
        </button>
    </div>

    <!-- Audio Element for Modi Ji Diwali Voice Message -->
    <audio id="diwaliAudio" preload="auto">
        <source src="diwali-wish.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
