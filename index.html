<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Diwali 🪔</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lit-up Diwali City Skyline Backdrop -->
    <div class="city-backdrop"></div>
    <div class="sky-gradient-overlay"></div>

    <!-- Hardware-Accelerated 60FPS Fireworks Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Sudden Skyburst Flash -->
    <div id="flash" class="flash-overlay"></div>

    <!-- Minimalist Meme Landing Screen: Sleek Play Button -->
    <div id="landingScreen" class="landing-screen">
        <div class="play-btn-wrapper">
            <button id="playBtn" class="play-btn" aria-label="Play">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <div class="btn-ripple"></div>
            </button>
            <div id="clickHint" class="click-hint">Click ▶</div>
        </div>
    </div>

    <!-- Celebration Screen: Typography + Dynamic Living Diya -->
    <div id="celebrationScreen" class="celebration-screen hidden">
        <div class="greeting-container">
            <!-- Polished Gold Typography -->
            <h1 class="diwali-heading">
                <span class="text-happy">HAPPY</span>
                <span class="text-diwali">DIWALI</span>
            </h1>

            <!-- Aesthetic Handcrafted Diya with Living Dynamic Flame -->
            <div class="diya-stage">
                <!-- Warm Ambient Light Pool -->
                <div class="diya-light-pool"></div>

                <div class="diya-artwork">
                    <!-- Dynamic Living Flame -->
                    <div class="flame-wrap">
                        <div class="flame-halo"></div>
                        <div class="flame-body"></div>
                        <div class="flame-amber"></div>
                        <div class="flame-white-core"></div>
                        <div class="wick"></div>
                        <div class="flame-spark fs1"></div>
                        <div class="flame-spark fs2"></div>
                    </div>

                    <!-- Brass & Terracotta Ornate Diya SVG -->
                    <svg class="diya-svg" viewBox="0 0 160 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#8a3c00"/>
                                <stop offset="25%" stop-color="#e58e26"/>
                                <stop offset="50%" stop-color="#ffd369"/>
                                <stop offset="75%" stop-color="#e58e26"/>
                                <stop offset="100%" stop-color="#8a3c00"/>
                            </linearGradient>
                            <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#b35400"/>
                                <stop offset="50%" stop-color="#fff1b8"/>
                                <stop offset="100%" stop-color="#b35400"/>
                            </linearGradient>
                            <radialGradient id="oilGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#ffbe33"/>
                                <stop offset="70%" stop-color="#994000"/>
                                <stop offset="100%" stop-color="#4d1a00"/>
                            </radialGradient>
                            <filter id="diyaShadow" x="-20%" y="-20%" width="140%" height="150%">
                                <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
                            </filter>
                        </defs>
                        <!-- Base Stand -->
                        <ellipse cx="80" cy="62" rx="36" ry="6" fill="#5c2600" opacity="0.9"/>
                        <path d="M62 58 Q80 65 98 58 L94 54 Q80 57 66 54 Z" fill="url(#brassGrad)"/>
                        <!-- Diya Belly Bowl -->
                        <path d="M12 28 C12 55 52 60 80 60 C108 60 148 55 148 28 C148 22 135 24 80 24 C25 24 12 22 12 28 Z" fill="url(#brassGrad)" filter="url(#diyaShadow)"/>
                        <!-- Traditional Engraved Ornamentation -->
                        <path d="M28 34 Q80 46 132 34" stroke="#5c2600" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65"/>
                        <circle cx="80" cy="42" r="3" fill="#ffe082"/>
                        <circle cx="60" cy="40" r="2.2" fill="#ffe082"/>
                        <circle cx="100" cy="40" r="2.2" fill="#ffe082"/>
                        <circle cx="44" cy="37" r="1.8" fill="#ffe082"/>
                        <circle cx="116" cy="37" r="1.8" fill="#ffe082"/>
                        <!-- Top Rim -->
                        <ellipse cx="80" cy="25" rx="68" ry="11" fill="url(#rimGrad)"/>
                        <!-- Oil Pool -->
                        <ellipse cx="80" cy="25" rx="58" ry="8" fill="url(#oilGrad)"/>
                    </svg>
                </div>
            </div>

            <!-- Fading Tap Hint -->
            <div id="tapGuide" class="tap-guide">Tap screen to celebrate ✨</div>
        </div>

        <!-- Sleek Floating Replay Button -->
        <button id="replayBtn" class="replay-btn" aria-label="Replay" title="Replay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        </button>
    </div>

    <!-- Audio Elements -->
    <audio id="diwaliAudio" preload="auto">
        <source src="diwali-wish.mp3" type="audio/mpeg">
    </audio>
    <audio id="whistleAudio" preload="auto">
        <source src="mixkit-fast-whistle-firework-3103.wav" type="audio/wav">
    </audio>
    <audio id="explosionAudio" preload="auto">
        <source src="mixkit-firework-rockets-exploding-in-the-sky-2993.wav" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
